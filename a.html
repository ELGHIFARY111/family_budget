<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="description" content="menghitung pengeluaran keluarga" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="canonical" href="https://www.example.com/" />
    <title>hitungin</title>
  </head>
  <body>
    <header>
      <nav>
        <a href="index.html">Home</a>
        <a href="a.html">A</a>
      </nav>
    </header>
    <main>
      <article>
        <h1>Pengeluaran Keluarga</h1>
        <p>hitung pengeluaran keluarga dengan mudah</p>
        <p id="saldo">Rp</p>
        <section>
          <h2>tambah transaksi</h2>
          <form id="tambahTransaksi">
            <label for="tanggal">Tanggal:</label>
            <input
              type="date"
              id="tanggal"
              name="tanggal"
              placeholder="Tanggal"
            />
            <label for="deskripsi">Deskripsi:</label>
            <input
              type="text"
              id="deskripsi"
              name="deskripsi"
              placeholder="Deskripsi"
            />
            <label for="tipe">tipe:</label>
            <select name="tipe" id="tipe">
              <option value="pendapatan">pendapatan</option>
              <option value="pengeluaran">pengeluaran</option>
            </select>
            <label for="jumlah">Jumlah:</label>
            <input
              type="number"
              id="jumlah"
              name="jumlah"
              placeholder="Jumlah"
            />
            <button type="submit" id="button_tambah">Tambah</button>
          </form>

          <h2>transaksi</h2>
          <label for="filterTipe">filter tipe:</label>
          <select name="filterTipe" id="filterTipe">
            <option value="semua">semua</option>
            <option value="pendapatan">pendapatan</option>
            <option value="pengeluaran">pengeluaran</option>
          </select>

          <br /><br />
          <input type="text" id="search" placeholder="Cari transaksi..." />
          <table cellspacing="0" cellpadding="3" border="1">
            <thead>
              <tr>
                <th>no.</th>
                <th>id</th>
                <th>Tanggal</th>
                <th>Deskripsi</th>
                <th>tipe</th>
                <th>Jumlah</th>
                <th>Aksi</th>
              </tr>
            </thead>
            <tbody id="daftarTransaksi">
              <!-- Data pengeluaran harian akan ditambahkan di sini -->
            </tbody>
          </table>
        </section>
      </article>
    </main>
    <footer>
      <p>&copy; 2024 hitungin. All rights reserved.</p>
    </footer>
    <script src="a.js"></script>
  </body>
</html>
